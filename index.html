<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostwriter - Handshake</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div id="app">
        <header>
            <h1>👻 Ghostwriter</h1>
            <p class="subtitle">Serverless AI Writing Partner</p>
        </header>

        <main>
            <!-- Auth Section -->
            <div id="auth-section">
                <button id="auth-btn" class="btn primary">
                    <span class="icon">G</span> Login with Google
                </button>
            </div>

            <!-- Dashboard Section (Hidden by default) -->
            <div id="dashboard-section" class="hidden">
                <div class="user-info">
                    <p>Welcome, <span id="user-email">Guest</span></p>
                    <button id="signout-btn" class="btn text">Sign Out</button>
                </div>

                <div class="card">
                    <h2>System Status</h2>
                    <p>Ghostwriter Cortex Connection...</p>

                    <button id="init-btn" class="btn success">
                        Initializing Ghostwriter...
                    </button>
                    <button id="settings-btn" class="btn secondary">
                        ⚙️ Settings
                    </button>

                    <div id="console-output" class="console">
                        <div class="log-line">System standby...</div>
                    </div>
                </div>

                <!-- Chat Section (Hidden by default) -->
                <div id="chat-section" class="card hidden">
                    <div id="chat-history" class="chat-history">
                        <!-- Messages will appear here -->
                        <div class="message assistant">
                            <div class="bubble">Hello! I am Ghostwriter. How can I help you write today?</div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
                        <button id="send-btn" class="btn primary">Send</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-settings-btn" class="close">&times;</span>
                <h2>Settings</h2>

                <div class="form-group">
                    <label for="provider-select">LLM Provider</label>
                    <select id="provider-select">
                        <option value="gemini">Google Gemini</option>
                        <!-- Future: OpenAI, Claude, etc -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="api-key-input">API Key</label>
                    <input type="password" id="api-key-input" placeholder="Enter your API Key">
                    <small>Stored in your browser's LocalStorage.</small>
                </div>

                <div class="form-group">
                    <label for="model-select">Model</label>
                    <select id="model-select" disabled>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Default)</option>
                    </select>
                    <button id="refresh-models-btn" class="btn text" style="font-size: 0.8rem;">🔄 Refresh
                        Models</button>
                    <small style="display:block; margin-top:5px;">Enter API Key to fetch available models.</small>
                </div>

                <div class="form-group">
                    <label for="character-select">Character Persona</label>
                    <select id="character-select">
                        <option value="ghostwriter">Ghostwriter (Default)</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button id="test-connection-btn" class="btn secondary">Test Connection</button>
                    <button id="save-settings-btn" class="btn primary">Save & Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="secrets.js"></script>
    <script type="module" src="src/boot.js"></script>
</body>

</html>
